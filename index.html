<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관제사 철도 안전퀴즈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-indigo-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-train"></i></div>
        <div>
          <h1 class="font-bold text-lg text-indigo-950">관제사 철도 안전퀴즈</h1>
          <p class="text-xs text-indigo-500 font-medium">대구교통공사 / 종합관제센터</p>
        </div>
      </div>
      <button onclick="openAdminAuthModal()" class="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs font-semibold rounded-lg flex items-center space-x-1 transition">
        <i class="fa-solid fa-shield-halved"></i>
        <span>관리자 모드</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto px-4 py-8">

    <!-- Screen 1: 사번/성명 입력 Screen -->
    <div id="start-screen" class="glass-card rounded-2xl p-8 shadow-xl border border-white/50 text-center">
      <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
        🚆
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mb-1">관제사 철도 안전퀴즈</h2>
      <p class="text-xs font-bold text-indigo-600 mb-6">대구교통공사 / 종합관제센터</p>
      
      <div class="max-w-xs mx-auto space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">사번</label>
          <input type="text" id="emp-id" placeholder="예: 20260101" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">성명</label>
          <input type="text" id="emp-name" placeholder="예: 홍길동" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <button onclick="startQuiz()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold rounded-lg shadow-lg hover:shadow-xl transition text-sm">
          퀴즈 시작하기 🚀
        </button>
      </div>
    </div>

    <!-- Screen 2: Quiz Screen -->
    <div id="quiz-screen" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-indigo-50">
        <div>
          <span id="user-badge" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-md"></span>
          <span class="text-xs text-gray-500 ml-2" id="quiz-progress-text">문제 1 / 5</span>
        </div>
        <div class="flex items-center space-x-1 text-sm font-semibold text-amber-600 bg-amber-50 px-3 py-1 rounded-full">
          <i class="fa-regular fa-clock"></i>
          <span id="timer-text">00:00</span>
        </div>
      </div>

      <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
      </div>

      <div id="question-card" class="glass-card rounded-2xl p-6 shadow-xl border border-white/50 space-y-4">
        <span id="q-source" class="inline-block text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded"></span>
        <h3 id="q-title" class="text-base font-bold text-gray-900 leading-relaxed whitespace-pre-line"></h3>

        <div id="options-container" class="space-y-2 pt-2"></div>

        <!-- Correct/Incorrect Feedback Box -->
        <div id="feedback-box" class="hidden p-4 rounded-xl text-sm leading-relaxed border mt-4">
          <div id="feedback-header" class="font-bold flex items-center space-x-2 mb-1"></div>
          <div id="feedback-desc" class="text-gray-700 text-xs"></div>
        </div>

        <div class="flex justify-end pt-4">
          <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-sm transition">
            다음 문제 <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Screen 3: Result Screen -->
    <div id="result-screen" class="hidden glass-card rounded-2xl p-8 shadow-xl border border-white/50 text-center space-y-6">
      <div id="result-icon" class="text-6xl">🎉</div>
      <div>
        <h2 class="text-2xl font-bold text-gray-900">퀴즈가 완료되었습니다!</h2>
        <p class="text-sm text-gray-600 mt-1" id="result-summary"></p>
      </div>

      <div class="grid grid-cols-3 gap-3 max-w-md mx-auto">
        <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
          <p class="text-xs text-gray-500">최종 점수</p>
          <p class="text-xl font-black text-indigo-600" id="res-score">0점</p>
        </div>
        <div class="bg-purple-50 p-3 rounded-xl border border-purple-100">
          <p class="text-xs text-gray-500">소요 시간</p>
          <p class="text-xl font-black text-purple-600" id="res-time">00:00</p>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
          <p class="text-xs text-gray-500">정답률</p>
          <p class="text-xl font-black text-emerald-600" id="res-accuracy">0%</p>
        </div>
      </div>

      <div class="pt-2 flex justify-center space-x-3">
        <button onclick="downloadExcel()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm shadow transition flex items-center space-x-1.5">
          <i class="fa-solid fa-file-excel"></i>
          <span>결과 엑셀 저장</span>
        </button>
        <button onclick="location.reload()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-sm shadow transition">
          다시 풀기
        </button>
      </div>
    </div>

  </main>

  <!-- Admin Password Auth Modal -->
  <div id="admin-auth-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl"><i class="fa-solid fa-lock"></i></div>
        <h3 class="font-bold text-gray-900">관리자 인증</h3>
        <p class="text-xs text-gray-500">관리자 비밀번호를 입력하세요. (기본: 1234)</p>
      </div>
      <input type="password" id="admin-pass-input" placeholder="비밀번호" class="w-full px-3 py-2 border rounded-lg text-sm text-center" onkeyup="if(event.key==='Enter') verifyAdminPass()">
      <div class="flex space-x-2">
        <button onclick="closeAdminAuthModal()" class="w-1/2 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg">취소</button>
        <button onclick="verifyAdminPass()" class="w-1/2 py-2 bg-indigo-600 text-white text-xs font-bold rounded-lg">확인</button>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard Modal -->
  <div id="admin-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 bg-indigo-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-sm flex items-center space-x-2">
          <i class="fa-solid fa-user-shield"></i>
          <span>관리자 대시보드</span>
        </h3>
        <div class="flex items-center space-x-2">
          <button onclick="changeAdminPassPrompt()" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-2.5 py-1 rounded">🔑 암호 변경</button>
          <button onclick="closeAdminModal()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
      </div>

      <!-- Admin Tabs -->
      <div class="flex border-b bg-gray-50 text-xs font-bold text-gray-600">
        <button id="tab-btn-records" onclick="switchAdminTab('records')" class="px-5 py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold">응시자 성적 기록</button>
        <button id="tab-btn-questions" onclick="switchAdminTab('questions')" class="px-5 py-3 border-b-2 border-transparent hover:text-indigo-600">문제 은행 관리 및 업데이트</button>
      </div>

      <!-- Tab 1: Records -->
      <div id="tab-records" class="p-6 overflow-y-auto space-y-6 text-xs flex-1">
        <div class="grid grid-cols-4 gap-3">
          <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
            <span class="text-gray-500">총 응시 건수</span>
            <p id="adm-total" class="text-lg font-bold text-indigo-700">0건</p>
          </div>
          <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
            <span class="text-gray-500">평균 점수</span>
            <p id="adm-avg" class="text-lg font-bold text-emerald-700">0점</p>
          </div>
          <div class="bg-purple-50 p-3 rounded-lg border border-purple-100">
            <span class="text-gray-500">최고 점수</span>
            <p id="adm-max" class="text-lg font-bold text-purple-700">0점</p>
          </div>
          <div class="bg-amber-50 p-3 rounded-lg border border-amber-100">
            <span class="text-gray-500">평균 소요시간</span>
            <p id="adm-time" class="text-lg font-bold text-amber-700">00:00</p>
          </div>
        </div>

        <div class="flex justify-between items-center pt-2">
          <h4 class="font-bold text-sm text-gray-800">응시자 기록 목록</h4>
          <button onclick="exportAllExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded flex items-center space-x-1">
            <i class="fa-solid fa-file-excel"></i>
            <span>전체 기록 엑셀 내보내기</span>
          </button>
        </div>

        <div class="border rounded-lg overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 text-gray-700 font-semibold">
              <tr>
                <th class="p-2 border-b">일시</th>
                <th class="p-2 border-b">사번</th>
                <th class="p-2 border-b">성명</th>
                <th class="p-2 border-b">점수</th>
                <th class="p-2 border-b">소요시간</th>
              </tr>
            </thead>
            <tbody id="admin-records-body" class="divide-y text-gray-600">
              <tr><td colspan="5" class="p-4 text-center text-gray-400">저장된 기록이 없습니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab 2: Question Management -->
      <div id="tab-questions" class="hidden p-6 overflow-y-auto space-y-6 text-xs flex-1">
        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
          <span class="font-bold text-gray-700">현재 등록된 문제: <span id="q-count-badge" class="text-indigo-600">0</span>개</span>
          <div class="flex space-x-2">
            <button onclick="openQuestionForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded flex items-center space-x-1">
              <i class="fa-solid fa-plus"></i>
              <span>+ 새 문제 직접 추가</span>
            </button>
            <label class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded cursor-pointer flex items-center space-x-1">
              <i class="fa-solid fa-file-excel"></i>
              <span>📊 엑셀/CSV 파일로 불러오기</span>
              <input type="file" id="excel-upload-input" class="hidden" accept=".xlsx, .xls, .csv" onchange="importQuestionsExcel(event)">
            </label>
            <button onclick="resetDefaultQuestions()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold px-3 py-1.5 rounded">
              기본값 초기화
            </button>
          </div>
        </div>

        <div id="q-list-container" class="space-y-3"></div>
      </div>

    </div>
  </div>

  <!-- Add/Edit Question Modal -->
  <div id="q-form-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-xs">
      <h3 id="q-form-title" class="font-bold text-base text-gray-900 border-b pb-2">문제 편집</h3>
      <input type="hidden" id="form-q-id">
      
      <div>
        <label class="block font-bold text-gray-700 mb-1">출처 / 구분</label>
        <input type="text" id="form-q-source" placeholder="예: 철도안전 규정 P.75" class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="block font-bold text-gray-700 mb-1">문제 질문 내용</label>
        <textarea id="form-q-title" rows="3" placeholder="질문 내용을 입력하세요" class="w-full p-2 border rounded"></textarea>
      </div>

      <div class="space-y-2">
        <label class="block font-bold text-gray-700">보기 (1~5번)</label>
        <input type="text" id="form-q-opt1" placeholder="1번 보기" class="w-full p-2 border rounded">
        <input type="text" id="form-q-opt2" placeholder="2번 보기" class="w-full p-2 border rounded">
        <input type="text" id="form-q-opt3" placeholder="3번 보기" class="w-full p-2 border rounded">
        <input type="text" id="form-q-opt4" placeholder="4번 보기" class="w-full p-2 border rounded">
        <input type="text" id="form-q-opt5" placeholder="5번 보기 (선택)" class="w-full p-2 border rounded">
      </div>

      <div>
        <label class="block font-bold text-gray-700 mb-1">정답 번호 (1~5)</label>
        <input type="number" id="form-q-answer" min="1" max="5" class="w-24 p-2 border rounded">
      </div>

      <div>
        <label class="block font-bold text-gray-700 mb-1">해설 내용</label>
        <textarea id="form-q-comment" rows="2" placeholder="정답/오답 해설을 입력하세요" class="w-full p-2 border rounded"></textarea>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t">
        <button onclick="closeQuestionForm()" class="px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded">취소</button>
        <button onclick="saveQuestion()" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded">저장</button>
      </div>
    </div>
  </div>

  <script>
    const defaultQuizData = [
      { id: 1, source: "철도안전 평가", question: "다음 중 용어 정의로 틀린 것은?", options: ["“운행관리원”이라 함은 3호선 전동차에 승차하여 차내 승객안내 및 비상 시 열차운전 업무에 종사하는 직원을 말한다.", "“교번”이라 함은 기관사가 근무하여야 할 시간을 일정한 순서에 따르도록 지정한 것을 말한다.", "“철도차량”이라 함은 선로를 운행할 목적으로 제작된 동력차, 객차 및 특수차를 말한다.", "“역 순회요원”이라 함은 담당역에 상주하여 해당 역사를 순회하며 역구내 승객안내 및 설비 관리 등 역 운영에 관한 전반적인 안전관리를 담당하는 직원을 말한다.", "“차량기지”라 함은 차량의 정비, 검수 및 유치를 위한 장소를 말한다."], answer: 4, comment: "“역 순회요원”이라 함은 관리역별 담당구간의 각 역을 순회하면서 역구내 승객안내 및 설비 관리 등 역 운영에 관한 전반적인 안전관리를 담당하는 직원을 말합니다." },
      { id: 2, source: "철도안전 평가", question: "다음 용어 중 설명이 틀린 것은?", options: ["“운전관제”라 함은 도시철도의 안전운행을 위하여 열차의 운행을 집중 제어·감시·통제하거나 각종 설비와 시스템 운용에 관한 지시와 통제를 담당하는 곳을 말한다.", "“폐색준용법”이라 함은 상용 또는 대용폐색방식의 시행이 불가능할 때 열차 또는 차량의 운전을 위하여 폐색방식에 준용하여 시행하는 운전보안방식을 말한다.", "“운전취급자”라 함은 차량기지 또는 운전취급역에서 열차 또는 차량운행에 필요한 신호 및 진로를 조작하는 자를 말한다.", "“작업자”라 함은 유지보수 및 점검 등을 위하여 지정된 현장에서 작업을 하는 자를 말한다.", "“감독자”라 함은 공사 직원으로서 시공사 및 용역업체의 직원을 지휘·감독하는 자를 말한다."], answer: 1, comment: "“철도관제”라 함은 도시철도의 안전운행을 위하여 열차의 운행을 집중 제어·감시·통제하거나 각종 설비와 시스템 운용에 관한 지시와 통제를 담당하는 곳을 말합니다." },
      { id: 3, source: "철도안전 평가", question: "음주자에 대한 조치 기준으로 맞지 않는 것은?", options: ["0.02% ~ 0.1%미만 연 1회 확인된 때 : 당해 업무중지", "0.02% ~ 0.1%미만 연 2회 확인된 때 : 당해 업무중지 및 주의조치", "0.02% ~ 0.1%미만 연 3회 확인된 때 : 당해 업무중지 및 징계의뢰", "0.02%미만 : 정신교육(업무 전)", "0.1%이상 시 : 당해 업무중지 및 징계의뢰"], answer: 2, comment: "연 2회 확인된 때에는 당해 업무중지 및 '엄중경고' 조치에 해당합니다." },
      { id: 4, source: "철도안전 평가", question: "다음은 직원에 대한 음주 제한 기준이다. 괄호 안에 들어갈 숫자로 맞게 짝지어진 것은?\n\n'직원에 대한 음주 제한의 기준은 혈중알콜농도 ( % )이상으로 하며, ( % )이상을 만취 상태로 본다.'", options: ["0.03, 0.1", "0.02, 0.05", "0.03, 0.9", "0.03, 0.5", "0.02, 0.1"], answer: 5, comment: "직원에 대한 음주 제한 기준은 혈중알콜농도 0.02% 이상이며, 0.1% 이상을 만취 상태로 봅니다." },
      { id: 5, source: "철도안전 평가", question: "다음 중 인적오류 관리 방안으로 옳지 않은 것은?", options: ["지적확인환호 시행", "중점지도관리대상자 선정", "적성검사 정기 시행", "휴대전화 및 전자기기 사용제한", "승무적합성 검사 실시"], answer: 3, comment: "인적오류 관리 방안에는 교육, 승무 적합성검사, 중점지도관리대상자 선정, 지적확인환호, 휴대전화 제한, 졸음방지 독려활동 등이 포함됩니다." }
    ];

    function loadQuizQuestions() {
      const saved = localStorage.getItem("rail_quiz_questions");
      return saved ? JSON.parse(saved) : defaultQuizData;
    }

    function saveQuizQuestions(qs) {
      localStorage.setItem("rail_quiz_questions", JSON.stringify(qs));
    }

    let currentQuestions = loadQuizQuestions();
    let userEmpId = "", userEmpName = "";
    let currentIndex = 0, score = 0;
    let userAnswers = [];
    let timerInterval = null, secondsElapsed = 0;

    function getAdminPass() {
      return localStorage.getItem("rail_admin_pass") || "1234";
    }

    function startQuiz() {
      currentQuestions = loadQuizQuestions();
      if (currentQuestions.length === 0) {
        alert("등록된 문제가 없습니다. 관리자 모드에서 문제를 등록해 주세요.");
        return;
      }
      const idInput = document.getElementById("emp-id").value.trim();
      const nameInput = document.getElementById("emp-name").value.trim();
      if (!idInput || !nameInput) {
        alert("사번과 성명을 입력하세요.");
        return;
      }
      userEmpId = idInput; userEmpName = nameInput;
      document.getElementById("user-badge").innerText = `${userEmpName}(${userEmpId})`;
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      startTimer();
      renderQuestion();
    }

    function startTimer() {
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById("timer-text").innerText = `${m}:${s}`;
      }, 1000);
    }

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById("q-source").innerText = q.source || "안전 규정";
      document.getElementById("q-title").innerText = `${currentIndex + 1}. ${q.question}`;
      document.getElementById("quiz-progress-text").innerText = `문제 ${currentIndex + 1} / ${currentQuestions.length}`;
      document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;

      const container = document.getElementById("options-container");
      container.innerHTML = "";
      document.getElementById("feedback-box").classList.add("hidden");
      document.getElementById("next-btn").classList.add("hidden");

      q.options.forEach((opt, idx) => {
        if (!opt) return;
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-3.5 rounded-xl border border-gray-200 bg-white hover:bg-indigo-50/50 hover:border-indigo-200 transition text-xs font-medium leading-relaxed flex items-start space-x-2";
        btn.innerHTML = `<span class="font-bold text-indigo-600">${idx + 1}.</span><span>${opt}</span>`;
        btn.onclick = () => selectOption(idx + 1);
        container.appendChild(btn);
      });
    }

    function selectOption(selected) {
      const q = currentQuestions[currentIndex];
      const isCorrect = selected === Number(q.answer);
      if (isCorrect) score += (100 / currentQuestions.length);

      userAnswers.push({ qId: q.id, question: q.question, selected, answer: q.answer, isCorrect });

      const buttons = document.getElementById("options-container").children;
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i + 1 === Number(q.answer)) buttons[i].classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-900");
        else if (i + 1 === selected && !isCorrect) buttons[i].classList.add("border-rose-500", "bg-rose-50", "text-rose-900");
      }

      const fbBox = document.getElementById("feedback-box");
      const fbHeader = document.getElementById("feedback-header");
      const fbDesc = document.getElementById("feedback-desc");
      fbBox.classList.remove("hidden");

      if (isCorrect) {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        fbBox.className = "p-4 rounded-xl text-sm border bg-emerald-50 border-emerald-200 text-emerald-900 mt-4";
        fbHeader.innerHTML = `<span>🎉 정답입니다!</span>`;
      } else {
        document.getElementById("question-card").classList.add("animate-shake");
        setTimeout(() => document.getElementById("question-card").classList.remove("animate-shake"), 400);
        fbBox.className = "p-4 rounded-xl text-sm border bg-rose-50 border-rose-200 text-rose-900 mt-4";
        fbHeader.innerHTML = `<span>😅 오답입니다 (정답: ${q.answer}번)</span>`;
      }
      fbDesc.innerText = q.comment || "해설이 등록되어 있지 않습니다.";
      document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) renderQuestion();
      else finishQuiz();
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");

      const finalScore = Math.round(score);
      document.getElementById("res-score").innerText = `${finalScore}점`;
      document.getElementById("res-time").innerText = document.getElementById("timer-text").innerText;
      document.getElementById("res-accuracy").innerText = `${finalScore}%`;
      document.getElementById("result-summary").innerText = `${userEmpName} 님, 수고하셨습니다.`;

      saveRecord({ date: new Date().toLocaleString(), empId: userEmpId, name: userEmpName, score: finalScore, time: document.getElementById("timer-text").innerText });
    }

    function saveRecord(rec) {
      const recs = JSON.parse(localStorage.getItem("rail_quiz_records") || "[]");
      recs.push(rec);
      localStorage.setItem("rail_quiz_records", JSON.stringify(recs));
    }

    function downloadExcel() {
      const data = userAnswers.map((u, i) => ({
        "사번": userEmpId, "성명": userEmpName, "문제번호": i + 1, "질문": u.question, "제출답안": u.selected, "정답": u.answer, "정답여부": u.isCorrect ? "O" : "X"
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "평가결과");
      XLSX.writeFile(wb, `철도안전퀴즈_${userEmpId}_${userEmpName}.xlsx`);
    }

    /* Admin Functions */
    function openAdminAuthModal() {
      document.getElementById("admin-pass-input").value = "";
      document.getElementById("admin-auth-modal").classList.remove("hidden");
    }
    function closeAdminAuthModal() {
      document.getElementById("admin-auth-modal").classList.add("hidden");
    }
    function verifyAdminPass() {
      const input = document.getElementById("admin-pass-input").value;
      if (input === getAdminPass()) {
        closeAdminAuthModal();
        renderAdminDashboard();
        renderQuestionList();
        document.getElementById("admin-modal").classList.remove("hidden");
      } else {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }
    function closeAdminModal() {
      document.getElementById("admin-modal").classList.add("hidden");
    }
    function changeAdminPassPrompt() {
      const p = prompt("새 관리자 비밀번호를 입력하세요:");
      if (p) {
        localStorage.setItem("rail_admin_pass", p);
        alert("비밀번호가 변경되었습니다.");
      }
    }

    function switchAdminTab(tab) {
      if (tab === 'records') {
        document.getElementById("tab-records").classList.remove("hidden");
        document.getElementById("tab-questions").classList.add("hidden");
        document.getElementById("tab-btn-records").className = "px-5 py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold";
        document.getElementById("tab-btn-questions").className = "px-5 py-3 border-b-2 border-transparent hover:text-indigo-600";
      } else {
        document.getElementById("tab-records").classList.add("hidden");
        document.getElementById("tab-questions").classList.remove("hidden");
        document.getElementById("tab-btn-records").className = "px-5 py-3 border-b-2 border-transparent hover:text-indigo-600";
        document.getElementById("tab-btn-questions").className = "px-5 py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold";
      }
    }

    function renderAdminDashboard() {
      const recs = JSON.parse(localStorage.getItem("rail_quiz_records") || "[]");
      document.getElementById("adm-total").innerText = `${recs.length}건`;
      if (recs.length > 0) {
        const avg = Math.round(recs.reduce((a, b) => a + b.score, 0) / recs.length);
        const max = Math.max(...recs.map(r => r.score));
        document.getElementById("adm-avg").innerText = `${avg}점`;
        document.getElementById("adm-max").innerText = `${max}점`;
        document.getElementById("adm-time").innerText = recs[recs.length - 1].time;
      }
      const tbody = document.getElementById("admin-records-body");
      tbody.innerHTML = recs.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-gray-400">저장된 기록이 없습니다.</td></tr>` :
        recs.map(r => `<tr><td class="p-2 border-b">${r.date}</td><td class="p-2 border-b">${r.empId}</td><td class="p-2 border-b">${r.name}</td><td class="p-2 border-b font-bold">${r.score}점</td><td class="p-2 border-b">${r.time}</td></tr>`).join("");
    }

    function exportAllExcel() {
      const recs = JSON.parse(localStorage.getItem("rail_quiz_records") || "[]");
      if (recs.length === 0) return alert("내보낼 기록이 없습니다.");
      const ws = XLSX.utils.json_to_sheet(recs);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "전체응시기록");
      XLSX.writeFile(wb, `관제사_철도안전퀴즈_전체기록.xlsx`);
    }

    /* Question Management Logic */
    function renderQuestionList() {
      const qs = loadQuizQuestions();
      document.getElementById("q-count-badge").innerText = qs.length;
      const container = document.getElementById("q-list-container");
      if (qs.length === 0) {
        container.innerHTML = `<p class="p-8 text-center text-gray-400 border rounded-lg">등록된 문제가 없습니다. 새로운 문제를 등록해 보세요.</p>`;
        return;
      }
      container.innerHTML = qs.map((q, idx) => `
        <div class="border rounded-lg p-3 bg-white space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-[10px] font-bold">${q.source || '미지정'}</span>
              <h5 class="font-bold text-gray-900 mt-1">${idx + 1}. ${q.question}</h5>
            </div>
            <div class="flex space-x-1">
              <button onclick="editQuestion(${q.id})" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-[10px]">수정</button>
              <button onclick="deleteQuestion(${q.id})" class="px-2 py-1 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded text-[10px]">삭제</button>
            </div>
          </div>
          <div class="text-gray-600 pl-2 space-y-0.5">
            ${q.options.map((opt, i) => opt ? `<div class="${i + 1 === Number(q.answer) ? 'font-bold text-emerald-600' : ''}">${i + 1})${opt}</div>` : '').join("")}
          </div>
          <p class="text-gray-400 text-[11px] bg-gray-50 p-1.5 rounded">💡 해설: ${q.comment || '없음'}</p>
        </div>
      `).join("");
    }

    function openQuestionForm(q = null) {
      document.getElementById("q-form-title").innerText = q ? "문제 수정" : "새 문제 추가";
      document.getElementById("form-q-id").value = q ? q.id : "";
      document.getElementById("form-q-source").value = q ? q.source : "";
      document.getElementById("form-q-title").value = q ? q.question : "";
      document.getElementById("form-q-opt1").value = q && q.options[0] ? q.options[0] : "";
      document.getElementById("form-q-opt2").value = q && q.options[1] ? q.options[1] : "";
      document.getElementById("form-q-opt3").value = q && q.options[2] ? q.options[2] : "";
      document.getElementById("form-q-opt4").value = q && q.options[3] ? q.options[3] : "";
      document.getElementById("form-q-opt5").value = q && q.options[4] ? q.options[4] : "";
      document.getElementById("form-q-answer").value = q ? q.answer : 1;
      document.getElementById("form-q-comment").value = q ? q.comment : "";
      document.getElementById("q-form-modal").classList.remove("hidden");
    }

    function closeQuestionForm() {
      document.getElementById("q-form-modal").classList.add("hidden");
    }

    function saveQuestion() {
      const qId = document.getElementById("form-q-id").value;
      const source = document.getElementById("form-q-source").value.trim();
      const question = document.getElementById("form-q-title").value.trim();
      const options = [
        document.getElementById("form-q-opt1").value.trim(),
        document.getElementById("form-q-opt2").value.trim(),
        document.getElementById("form-q-opt3").value.trim(),
        document.getElementById("form-q-opt4").value.trim(),
        document.getElementById("form-q-opt5").value.trim()
      ].filter(Boolean);
      const answer = Number(document.getElementById("form-q-answer").value);
      const comment = document.getElementById("form-q-comment").value.trim();

      if (!question || options.length < 2) return alert("질문과 최소 2개 이상의 보기를 입력하세요.");

      let qs = loadQuizQuestions();
      if (qId) {
        qs = qs.map(q => q.id == qId ? { id: Number(qId), source, question, options, answer, comment } : q);
      } else {
        qs.push({ id: Date.now(), source, question, options, answer, comment });
      }

      saveQuizQuestions(qs);
      closeQuestionForm();
      renderQuestionList();
    }

    function editQuestion(id) {
      const qs = loadQuizQuestions();
      const target = qs.find(q => q.id == id);
      if (target) openQuestionForm(target);
    }

    function deleteQuestion(id) {
      if (!confirm("해당 문제를 삭제하시겠습니까?")) return;
      let qs = loadQuizQuestions();
      qs = qs.filter(q => q.id != id);
      saveQuizQuestions(qs);
      renderQuestionList();
    }

    function resetDefaultQuestions() {
      if (!confirm("모든 문제 데이터를 기본 문제 세트로 초기화하시겠습니까?")) return;
      saveQuizQuestions(defaultQuizData);
      renderQuestionList();
    }

    /* 엑셀/CSV 불러오기 유연한 파싱 로직 */
    function importQuestionsExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

          if (jsonRows.length === 0) {
            alert("파일에 읽을 데이터가 없습니다.");
            return;
          }

          const newQuestions = jsonRows.map((row, index) => {
            // 유연한 열 이름 매핑
            const source = row["출처"] || row["구분"] || row["Source"] || "안전 규정";
            const question = row["질문"] || row["문제"] || row["Question"] || "";
            const options = [
              row["보기1"] || row["보기 1"] || row["option1"] || "",
              row["보기2"] || row["보기 2"] || row["option2"] || "",
              row["보기3"] || row["보기 3"] || row["option3"] || "",
              row["보기4"] || row["보기 4"] || row["option4"] || "",
              row["보기5"] || row["보기 5"] || row["option5"] || ""
            ].map(v => String(v).trim()).filter(Boolean);

            const answer = Number(row["정답"] || row["Answer"] || 1);
            const comment = String(row["해설"] || row["Comment"] || "").trim();

            return {
              id: Date.now() + index,
              source,
              question,
              options,
              answer,
              comment
            };
          }).filter(q => q.question && q.options.length >= 2);

          if (newQuestions.length === 0) {
            alert("올바른 문제 형식을 찾지 못했습니다.\n엑셀 1행의 항목 이름이 '질문, 보기1, 보기2, 보기3, 보기4, 정답, 해설'로 되어 있는지 확인해 주세요.");
            return;
          }

          saveQuizQuestions(newQuestions);
          renderQuestionList();
          alert(`${newQuestions.length}개의 문제가 성공적으로 업데이트되었습니다! 🎉`);
          e.target.value = ""; // 파일 입력 초기화
        } catch (err) {
          alert("파일을 처리하는 중 오류가 발생했습니다.");
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
