<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관제사 철도 안전퀴즈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-indigo-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-train"></i></div>
        <div>
          <h1 class="font-bold text-lg text-indigo-950">관제사 철도 안전퀴즈</h1>
          <p class="text-xs text-indigo-500 font-medium">대구교통공사 / 종합관제센터</p>
        </div>
      </div>
      <button onclick="openAdminAuthModal()" class="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 text-xs font-semibold rounded-lg flex items-center space-x-1 transition">
        <i class="fa-solid fa-shield-halved"></i>
        <span>관리자 모드</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto px-4 py-8">

    <!-- Screen 1: 사번/성명 입력 Screen -->
    <div id="start-screen" class="glass-card rounded-2xl p-8 shadow-xl border border-white/50 text-center">
      <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
        🚆
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mb-1">관제사 철도 안전퀴즈</h2>
      <p class="text-xs font-bold text-indigo-600 mb-6">대구교통공사 / 종합관제센터</p>
      
      <div class="max-w-xs mx-auto space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">사번</label>
          <input type="text" id="emp-id" placeholder="예: 20260101" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">성명</label>
          <input type="text" id="emp-name" placeholder="예: 홍길동" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>
        <button onclick="startQuiz()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold rounded-lg shadow-lg hover:shadow-xl transition text-sm">
          퀴즈 시작하기 🚀
        </button>
      </div>
    </div>

    <!-- Screen 2: Quiz Screen -->
    <div id="quiz-screen" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-indigo-50">
        <div>
          <span id="user-badge" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-md"></span>
          <span class="text-xs text-gray-500 ml-2" id="quiz-progress-text">문제 1 / 5</span>
        </div>
        <div class="flex items-center space-x-1 text-sm font-semibold text-amber-600 bg-amber-50 px-3 py-1 rounded-full">
          <i class="fa-regular fa-clock"></i>
          <span id="timer-text">00:00</span>
        </div>
      </div>

      <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
      </div>

      <div id="question-card" class="glass-card rounded-2xl p-6 shadow-xl border border-white/50 space-y-4">
        <span id="q-source" class="inline-block text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded"></span>
        <h3 id="q-title" class="text-base font-bold text-gray-900 leading-relaxed whitespace-pre-line"></h3>

        <div id="options-container" class="space-y-2 pt-2"></div>

        <!-- Correct/Incorrect Feedback Box -->
        <div id="feedback-box" class="hidden p-4 rounded-xl text-sm leading-relaxed border mt-4">
          <div id="feedback-header" class="font-bold flex items-center space-x-2 mb-1"></div>
          <div id="feedback-desc" class="text-gray-700 text-xs"></div>
        </div>

        <div class="flex justify-end pt-4">
          <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-sm transition">
            다음 문제 <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Screen 3: Result Screen -->
    <div id="result-screen" class="hidden glass-card rounded-2xl p-8 shadow-xl border border-white/50 text-center space-y-6">
      <div id="result-icon" class="text-6xl">🎉</div>
      <div>
        <h2 class="text-2xl font-bold text-gray-900">퀴즈가 완료되었습니다!</h2>
        <p class="text-sm text-gray-600 mt-1" id="result-summary"></p>
      </div>

      <div class="grid grid-cols-3 gap-3 max-w-md mx-auto">
        <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
          <p class="text-xs text-gray-500">최종 점수</p>
          <p class="text-xl font-black text-indigo-600" id="res-score">0점</p>
        </div>
        <div class="bg-purple-50 p-3 rounded-xl border border-purple-100">
          <p class="text-xs text-gray-500">소요 시간</p>
          <p class="text-xl font-black text-purple-600" id="res-time">00:00</p>
        </div>
        <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
          <p class="text-xs text-gray-500">정답률</p>
          <p class="text-xl font-black text-emerald-600" id="res-accuracy">0%</p>
        </div>
      </div>

      <div class="pt-2 flex justify-center space-x-3">
        <button onclick="downloadExcel()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm shadow transition flex items-center space-x-1.5">
          <i class="fa-solid fa-file-excel"></i>
          <span>결과 엑셀 저장</span>
        </button>
        <button onclick="location.reload()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-sm shadow transition">
          다시 풀기
        </button>
      </div>
    </div>

  </main>

  <!-- Admin Password Auth Modal -->
  <div id="admin-auth-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl"><i class="fa-solid fa-lock"></i></div>
        <h3 class="font-bold text-gray-900">관리자 인증</h3>
        <p class="text-xs text-gray-500">관리자 비밀번호를 입력하세요. (기본: 1234)</p>
      </div>
      <input type="password" id="admin-pass-input" placeholder="비밀번호" class="w-full px-3 py-2 border rounded-lg text-sm text-center" onkeyup="if(event.key==='Enter') verifyAdminPass()">
      <div class="flex space-x-2">
        <button onclick="closeAdminAuthModal()" class="w-1/2 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg">취소</button>
        <button onclick="verifyAdminPass()" class="w-1/2 py-2 bg-indigo-600 text-white text-xs font-bold rounded-lg">확인</button>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard Modal -->
  <div id="admin-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 bg-indigo-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-sm flex items-center space-x-2">
          <i class="fa-solid fa-user-shield"></i>
          <span>관리자 대시보드</span>
        </h3>
        <div class="flex items-center space-x-2">
          <button onclick="changeAdminPassPrompt()" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-2.5 py-1 rounded">🔑 암호 변경</button>
          <button onclick="closeAdminModal()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
      </div>

      <!-- Admin Tabs -->
      <div class="flex border-b bg-gray-50 text-xs font-bold text-gray-600">
        <button id="tab-btn-records" onclick="switchAdminTab('records')" class="px-5 py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold">응시자 성적 기록</button>
        <button id="tab-btn-questions" onclick="switchAdminTab('questions')" class="px-5 py-3 border-b-2 border-transparent hover:text-indigo-600">문제 은행 관리 및 업데이트</button>
      </div>

      <!-- Tab 1: Records -->
      <div id="tab-records" class="p-6 overflow-y-auto space-y-6 text-xs flex-1">
        <div class="grid grid-cols-4 gap-3">
          <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100">
            <span class="text-gray-500">총 응시 건수</span>
            <p id="adm-total" class="text-lg font-bold text-indigo-700">0건</p>
          </div>
          <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
            <span class="text-gray-500">평균 점수</span>
            <p id="adm-avg" class="text-lg font-bold text-emerald-700">0점</p>
          </div>
          <div class="bg-purple-50 p-3 rounded-lg border border-purple-100">
            <span class="text-gray-500">최고 점수</span>
            <p id="adm-max" class="text-lg font-bold text-purple-700">0점</p>
          </div>
          <div class="bg-amber-50 p-3 rounded-lg border border-amber-100">
            <span class="text-gray-500">평균 소요시간</span>
            <p id="adm-time" class="text-lg font-bold text-amber-700">00:00</p>
          </div>
        </div>

        <div class="flex justify-between items-center pt-2">
          <h4 class="font-bold text-sm text-gray-800">응시자 기록 목록</h4>
          <button onclick="exportAllExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded flex items-center space-x-1">
            <i class="fa-solid fa-file-excel"></i>
            <span>전체 기록 엑셀 내보내기</span>
          </button>
        </div>

        <div class="border rounded-lg overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 text-gray-700 font-semibold">
              <tr>
                <th class="p-2 border-b">일시</th>
                <th class="p-2 border-b">사번</th>
                <th class="p-2 border-b">성명</th>
                <th class="p-2 border-b">점수</th>
                <th class="p-2 border-b">소요시간</th>
              </tr>
            </thead>
            <tbody id="admin-records-body" class="divide-y text-gray-600">
              <tr><td colspan="5" class="p-4 text-center text-gray-400">저장된 기록이 없습니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab 2: Question Management -->
      <div id="tab-questions" class="hidden p-6 overflow-y-auto space-y-6 text-xs flex-1">
        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
          <span class="font-bold text-gray-700">현재 등록된 문제: <span id="q-count-badge" class="text-indigo-600">0</span>개</span>
          <div class="flex space-x-2">
            <button onclick="openQuestionForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded flex items-center space-x-1">
              <i class="fa-solid fa-plus"></i>
              <span>새 문제 추가</span>
            </button>
            <button onclick="exportQuestionsJSON()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-1.5 rounded">
              JSON 백업
            </button>
            <label class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-1.5 rounded cursor-pointer">
              JSON 불러오기
              <input type="file" id="json-upload-input" class="hidden
